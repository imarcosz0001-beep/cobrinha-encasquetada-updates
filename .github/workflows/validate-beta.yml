name: Validar Beta publicada

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - addon-update-beta.json
      - .github/workflows/validate-beta.yml
      - scripts/promote-beta.js
      - scripts/browser-e2e.js
      - scripts/validate-extension.js

permissions:
  contents: read

concurrency:
  group: validate-published-beta
  cancel-in-progress: true

jobs:
  validate:
    name: Integridade, segurança e navegador real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório oficial
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Identificar a versão Beta
        run: node -e "const fs=require('fs'); const beta=JSON.parse(fs.readFileSync('addon-update-beta.json','utf8')); fs.appendFileSync(process.env.GITHUB_ENV, 'BETA_VERSION=' + beta.version + '\n')"

      - name: Baixar, conferir e extrair o ZIP imutável
        env:
          EXPECTED_BETA_VERSION: ${{ env.BETA_VERSION }}
          PROMOTION_CONFIRMATION: PROMOVER
          VALIDATE_ONLY: "1"
          BETA_TEST_ROOT: .beta-extension
        run: node scripts/promote-beta.js

      - name: Validar segurança e recursos
        env:
          COBRINHA_EXTENSION_ROOT: .beta-extension
        run: node scripts/validate-extension.js

      - name: Abrir a extensão no navegador real
        env:
          COBRINHA_E2E: "1"
          COBRINHA_EXTENSION_ROOT: .beta-extension
        run: node scripts/browser-e2e.js

      - name: Limpar arquivos temporários
        if: always()
        shell: bash
        run: rm -rf .beta-extension .promotion-*.zip

      - name: Resumo
        if: success()
        shell: bash
        run: |
          echo "## ✅ Beta v${BETA_VERSION} aprovada nos testes automáticos" >> "$GITHUB_STEP_SUMMARY"
          echo "O canal Estável não foi alterado." >> "$GITHUB_STEP_SUMMARY"
